<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="42%" stop-color="#2563EB"/>
      <stop offset="76%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="96" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle with Smooth Curvature -->
  <rect width="192" height="192" rx="50" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="190" height="190" rx="49" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Gloss Highlight -->
  <path d="M0 50 A50 50 0 0 1 50 0 L142 0 A50 50 0 0 1 192 50 L192 88 C125 99 67 80 0 92 Z" fill="url(#glossGrad)"/>

  <!-- Protective Health Shield -->
  <path d="M46 41 H146 C151 90 118 138 96 150 C74 138 41 90 46 41 Z" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Medical Cross Inside Shield -->
  <!-- Vertical Bar -->
  <rect x="88" y="64" width="16" height="48" rx="8" fill="#ffffff"/>
  <!-- Horizontal Bar -->
  <rect x="72" y="80" width="48" height="16" rx="8" fill="#ffffff"/>

  <!-- Center Vaccine Droplet / Care Dot -->
  <circle cx="96" cy="88" r="7" fill="#10B981"/>
</svg>
